aid: nimasensor
name: NimaSensor
description: >-
  NIMA (originally 6SensorLabs, founded by MIT alumni Shireen Yates and Scott Sundvor) makes a
  portable, consumer-use gluten detection sensor for people living with celiac disease and gluten
  sensitivity. A pea-sized food sample is loaded into a single-use capsule, inserted into the
  handheld NIMA Sensor, and returns a clear result in about three minutes, detecting gluten down to
  10 ppm. The product relaunched in 2025-2026 with investment from RA Capital Management, pairing a
  next-generation sensor with newly engineered test capsules and the NIMA Now app. NIMA is a
  consumer hardware and e-commerce company (storefront hosted on Shopify), not a developer-API
  provider - it exposes no first-party public developer API. It is tracked in the API Evangelist
  network as a portfolio company of Uncork Capital.
